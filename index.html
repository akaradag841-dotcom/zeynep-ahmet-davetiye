overflow: hidden;

.background::before {

.particles {

     position: fixed;

    .hero {

    .couple-title {

    h1 {

    }

    .intro {

    }

    .envelope-stage {
      width: 100%;
padding-top: 70px;
  

      display: grid;
      place-items: center;
    }

    .envelope {
      position: relative;

      width: min(92vw, 590px);
      aspect-ratio: 1.48 / 1;

      perspective: 1700px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      z-index: 1;

      border-radius: 9px;
      background: #e6ce9d;

      box-shadow:
        0 25px 50px rgba(71, 55, 34, 0.22);
    }

    .letter {
  position: absolute;
  left: 50%;
  bottom: 2%;

  width: min(56%, 300px);
  aspect-ratio: 2 / 3;

  z-index: 3;
  overflow: hidden;

  border-radius: 18px;
  background: var(--paper);
  box-shadow: 0 14px 34px rgba(58, 45, 28, 0.24);

  transform: translate(-50%, 0);
opacity: 0;
  transition:
    transform 1.05s cubic-bezier(0.22, 1, 0.36, 1),
    width 0.7s ease,
    opacity: 0;
    z-index 0s linear 0.18s;
}

    .letter img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 4;

      overflow: hidden;
      border-radius: 9px;

      pointer-events: none;
    }

    .envelope-front::before,
    .envelope-front::after {
      content: "";

      position: absolute;
      bottom: 0;

      width: 52%;
      height: 100%;

      background: #efddb5;
transition:
  transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
  filter 0.75s ease;
      }
    .envelope-front::before {
      left: 0;

      clip-path:
        polygon(
          0 0,
          100% 51%,
          100% 100%,
          0 100%
        );
    }

    .envelope-front::after {
      right: 0;

      clip-path:
        polygon(
          100% 0,
          0 51%,
          0 100%,
          100% 100%
        );
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 59%;

      z-index: 6;

      transform-origin: top center;
      transform: rotateX(0deg);

      clip-path:
        polygon(
          0 0,
          50% 100%,
          100% 0
        );

      background:
        linear-gradient(
          160deg,
          #edd9ad,
          #ddc18a
        );

      backface-visibility: hidden;

      transition:
  transform 1s cubic-bezier(0.22, 1, 0.36, 1),
  z-index 0s linear 0.5s;
    }

    .seal {
      position: absolute;
      top: 50%;
      left: 50%;

      z-index: 6;

      width: 78px;
      height: 78px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #d4af5c,
          #aa7c2e
        );

      color: white;

      font-family: "Cormorant Garamond", serif;
font-size: 27px;
font-weight: 600;
letter-spacing: 2px;
      text-transform: uppercase;

      box-shadow:
        0 11px 24px rgba(111, 76, 22, 0.35);

      transform: translate(-50%, -50%);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }

    .envelope.open .envelope-flap {
      z-index: 1;
      transform: rotateX(180deg);
    }

    .envelope.open .letter {
  z-index: 7;
  width: min(73%, 390px);
  transform: translate(-50%, -52%);
      opacity: 1;
  transition-delay: 0.16s;
    }
.envelope.open .envelope-front::before {
  transform: translateX(-10px) translateY(6px) rotate(-3deg);
  filter: brightness(0.98);
}

.envelope.open .envelope-front::after {
  transform: translateX(10px) translateY(6px) rotate(3deg);
  filter: brightness(0.98);
}

    .envelope.open .seal {

    .confetti-container {

    .confetti {

    @keyframes confettiFall {

<div
  class="confetti-container"
  id="confettiContainer">
</div>


  <script>
    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const envelope =
          document.getElementById("envelope");

        const openButton =
          document.getElementById("openButton");

        const details =
          document.getElementById("details");

        const calendarButton =
          document.getElementById("calendarButton");

        const confettiContainer =
          document.getElementById("confettiContainer");

        let isOpen = false;
        let confettiPlayed = false;

        openButton.addEventListener(
          "click",
          function () {

            isOpen = !isOpen;

            envelope.classList.toggle(
              "open",
              isOpen
            );

            details.classList.toggle(
              "visible",
              isOpen
            );

            details.setAttribute(
              "aria-hidden",
              isOpen ? "false" : "true"
            );

            openButton.textContent =
              isOpen
                ? "Zarfı Kapat"
                : "Zarfı Aç";

            if (isOpen) {

              if (!confettiPlayed) {
                createConfetti();
                confettiPlayed = true;
              }

              setTimeout(
                function () {

                  details.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                  });

                },
                1100
              );
            }
          }
        );

        function updateCountdown() {

          const weddingDate =
            new Date(
              "2026-09-04T15:30:00+03:00"
            ).getTime();

          const difference =
            Math.max(
              0,
              weddingDate - Date.now()
            );

          const days =
            Math.floor(
              difference / 86400000
            );

          const hours =
            Math.floor(
              (difference / 3600000) % 24
            );

          const minutes =
            Math.floor(
              (difference / 60000) % 60
            );

          const seconds =
            Math.floor(
              (difference / 1000) % 60
            );

          document.getElementById(
            "days"
          ).textContent =
            String(days).padStart(2, "0");

          document.getElementById(
            "hours"
          ).textContent =
            String(hours).padStart(2, "0");

          document.getElementById(
            "minutes"
          ).textContent =
            String(minutes).padStart(2, "0");

          document.getElementById(
            "seconds"
          ).textContent =
            String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(
          updateCountdown,
          1000
        );

        function createConfetti() {

          const colors = [
            "#c59b47",
            "#ead8ae",
            "#5d704f",
            "#ffffff",
            "#d8b86a"
          ];

          for (
            let i = 0;
            i < 55;
            i += 1
          ) {

            const piece =
              document.createElement("span");

            piece.className =
              "confetti";

            piece.style.left =
              Math.random() * 100 + "%";

            piece.style.backgroundColor =
              colors[
                Math.floor(
                  Math.random() *
                  colors.length
                )
              ];

            piece.style.animationDelay =
              Math.random() * 1.2 + "s";

            piece.style.animationDuration =
              2.8 +
              Math.random() * 2 +
              "s";

            confettiContainer.appendChild(
              piece
            );

            setTimeout(
              function () {
                piece.remove();
              },
              5500
            );
          }
        }

        calendarButton.addEventListener(
          "click",
          function () {

            const calendarData = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "BEGIN:VEVENT",
              "SUMMARY:Zeynep ve Ahmet Nikah Töreni",
              "DTSTART:20260904T123000Z",
              "DTEND:20260904T143000Z",
              "LOCATION:Bornova Nikah Salonu",
              "DESCRIPTION:Zeynep ve Ahmet'in nikah töreni",
              "END:VEVENT",
              "END:VCALENDAR"
            ].join("\r\n");

            const calendarBlob =
              new Blob(
                [calendarData],
                {
                  type:
                    "text/calendar;charset=utf-8"
                }
              );

            const calendarUrl =
              URL.createObjectURL(
                calendarBlob
              );

            const downloadLink =
              document.createElement("a");

            downloadLink.href =
              calendarUrl;

            downloadLink.download =
              "zeynep-ahmet-nikah.ics";

            document.body.appendChild(
              downloadLink
            );

            downloadLink.click();
            downloadLink.remove();

            URL.revokeObjectURL(
              calendarUrl
            );
          }
        );
      }
    );
  </script>

<div

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const invitationImage = document.getElementById("invitationImage");
    const imageModal = document.getElementById("imageModal");
    const modalClose = document.getElementById("modalClose");

    invitationImage.addEventListener("click", function () {
      imageModal.classList.add("active");
      document.body.style.overflow = "hidden";
    });

    modalClose.addEventListener("click", function () {
      imageModal.classList.remove("active");
      document.body.style.overflow = "";
    });

    imageModal.addEventListener("click", function (event) {
      if (event.target === imageModal) {
        imageModal.classList.remove("active");
        document.body.style.overflow = "";
      }
    });
  });
</script>
