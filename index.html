  <style>

    :root {
      --cream: #f7f1e6;
      --paper: #fffdf8;
      --gold: #c59b47;
      --gold-soft: #e8d4a5;
      --green: #5d704f;
      --green-dark: #45583b;
      --text: #3e372f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      overflow-x: hidden;

      background:
        linear-gradient(
          180deg,
          #fffdf8 0%,
          #f7f1e6 55%,
          #f2e9dc 100%
        );

      color: var(--text);

      font-family:
        "Cormorant Garamond",
        serif;
    }

    button,
    a {
      font: inherit;
    }


    /* =========================
       ARKA PLAN
       ========================= */

    .background {
      position: fixed;

      inset: 0;

      z-index: -3;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 18%,
          rgba(197, 155, 71, 0.13),
          transparent 31%
        ),

        radial-gradient(
          circle at 82% 72%,
          rgba(93, 112, 79, 0.10),
          transparent 34%
        ),

        linear-gradient(
          180deg,
          #fffdf8 0%,
          #f3ebdf 100%
        );
    }


    /* Arkada artık fotoğraf YOK */


    .particles {
      position: fixed;

      inset: 0;

      z-index: -2;

      pointer-events: none;

      opacity: 0.32;

      background-image:
        radial-gradient(
          circle,
          rgba(197, 155, 71, 0.52) 1.2px,
          transparent 1.5px
        );

      background-size:
        70px 70px;
    }


    /* =========================
       ÜST BÖLÜM
       ========================= */

    .hero {
      min-height: 100svh;

      padding:
        max(34px, env(safe-area-inset-top))
        16px
        60px;

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;
    }


    .couple-title {
      color: var(--gold);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(34px, 9vw, 56px);

      font-weight: 500;

      letter-spacing: 0.03em;

      line-height: 1.05;

      text-shadow:
        0 3px 14px
        rgba(197, 155, 71, 0.12);
    }


    .couple-title .initial {
      font-size: 1.45em;

      font-weight: 600;

      line-height: 0;
    }


    .couple-title .ampersand {
      margin: 0 7px;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 1.15em;

      font-weight: 400;
    }


    h1 {
      margin-top: 4px;

      font-size:
        clamp(30px, 8vw, 46px);

      font-weight: 500;
    }


    .intro {
      width:
        min(94%, 580px);

      margin-top: 12px;

      color:
        rgba(62, 55, 47, 0.78);

      font-size:
        clamp(18px, 4.8vw, 23px);

      line-height: 1.45;
    }


    /* =========================
       ZARF ALANI
       ========================= */

    .envelope-stage {
      width: 100%;

      padding-top: 62px;

      display: grid;

      place-items: center;
    }


    .envelope {
      position: relative;

      width:
        min(92vw, 590px);

      aspect-ratio:
        1.48 / 1;

      perspective: 1700px;
    }


    .envelope-back {
      position: absolute;

      inset: 0;

      z-index: 1;

      border-radius: 12px;

      background:
        linear-gradient(
          145deg,
          #ead5a7,
          #dfc58f
        );

      box-shadow:
        0 25px 50px
        rgba(71, 55, 34, 0.22);
    }


    /* =========================
       DAVETİYE
       ========================= */

    .letter {
      position: absolute;

      left: 50%;

      bottom: 2%;

      width:
        min(56%, 300px);

      aspect-ratio:
        2 / 3;

      z-index: 3;

      overflow: hidden;

      border-radius: 18px;

      background: var(--paper);

      box-shadow:
        0 14px 34px
        rgba(58, 45, 28, 0.24);

      transform:
        translate(-50%, 0);

      opacity: 0;

      transition:
        transform
        1.05s
        cubic-bezier(0.22, 1, 0.36, 1),

        width
        0.7s
        ease,

        opacity
        0.45s
        ease,

        z-index
        0s
        linear
        0.18s;
    }


    .letter img {
      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;
    }


    /* =========================
       ZARF ÖN KISIM
       ========================= */

    .envelope-front {
      position: absolute;

      inset: 0;

      z-index: 4;

      overflow: hidden;

      border-radius: 12px;

      pointer-events: none;
    }


    .envelope-front::before,
    .envelope-front::after {
      content: "";

      position: absolute;

      bottom: 0;

      width: 52%;

      height: 100%;

      background:
        linear-gradient(
          165deg,
          #f2e1ba,
          #ead4a6
        );

      transition:
        transform
        0.75s
        cubic-bezier(0.22, 1, 0.36, 1),

        filter
        0.75s
        ease;
    }


    .envelope-front::before {
      left: 0;

      clip-path:
        polygon(
          0 0,
          100% 51%,
          100% 100%,
          0 100%
        );
    }


    .envelope-front::after {
      right: 0;

      clip-path:
        polygon(
          100% 0,
          0 51%,
          0 100%,
          100% 100%
        );
    }


    /* =========================
       ZARF KAPAĞI
       ========================= */

    .envelope-flap {
      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 59%;

      z-index: 6;

      transform-origin:
        top center;

      transform:
        rotateX(0deg);

      clip-path:
        polygon(
          0 0,
          50% 100%,
          100% 0
        );

      background:
        linear-gradient(
          160deg,
          #f0deb7,
          #dec18a
        );

      backface-visibility:
        hidden;

      transition:
        transform
        1s
        cubic-bezier(0.22, 1, 0.36, 1),

        z-index
        0s
        linear
        0.5s;
    }


    /* =========================
       ROMANTİK ZARF DESENLERİ
       ========================= */

    .envelope-decor {
      position: absolute;

      inset: 0;

      z-index: 12;

      pointer-events: none;
    }


    .envelope-decor .decor {
      position: absolute;

      color: #c8a24d;

      opacity: 0.90;

      text-shadow:
        0 3px 10px
        rgba(105, 75, 25, 0.12);
    }


    .heart {
      font-size: 15px;
    }


    .spark {
      font-size: 14px;
    }


    .flower {
      font-size: 18px;

      opacity: 0.62;
    }


    .d1 {
      top: 24px;
      left: 62px;
    }


    .d2 {
      top: 25px;
      right: 62px;
    }


    .d3 {
      top: 31px;
      left: 50%;

      transform:
        translateX(-50%);
    }


    .d4 {
      top: 58px;
      left: 118px;
    }


    .d5 {
      top: 60px;
      right: 118px;
    }


    .d6 {
      top: 47px;
      left: 28%;
    }


    .d7 {
      top: 47px;
      right: 28%;
    }


    .d8 {
      top: 76px;
      left: 50%;

      transform:
        translateX(-50%);
    }


    .d9 {
      top: 17px;
      left: 24px;
    }


    .d10 {
      top: 17px;
      right: 24px;
    }


    /* =========================
       MÜHÜR
       ========================= */

    .seal {
      position: absolute;

      top: 50%;

      left: 50%;

      z-index: 6;

      width: 78px;

      height: 78px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #d6b15b,
          #aa7c2e
        );

      color: white;

      font-size: 27px;

      font-weight: 600;

      letter-spacing: 2px;

      box-shadow:
        0 11px 24px
        rgba(111, 76, 22, 0.35);

      transform:
        translate(-50%, -50%);

      transition:
        opacity
        0.35s
        ease,

        transform
        0.35s
        ease;
    }


    .seal::before {
      content: "";

      position: absolute;

      inset: -12px;

      border:
        2px solid
        rgba(231, 197, 112, 0.7);

      border-radius: 50%;

      opacity: 0;

      box-shadow:
        0 0 12px
        rgba(231, 197, 112, 0.55),

        0 0 28px
        rgba(197, 155, 71, 0.35);

      transform:
        scale(0.7);

      pointer-events: none;
    }


    .envelope.open
    .seal::before {
      animation:
        sealLightBurst
        0.85s
        ease-out
        forwards;
    }


    @keyframes sealLightBurst {

      0% {
        opacity: 0;

        transform:
          scale(0.65);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          scale(2.2);
      }
    }


    .envelope.open
    .seal {
      animation:
        sealFlash
        0.55s
        ease-out
        forwards;
    }


    @keyframes sealFlash {

      0% {
        filter:
          brightness(1);
      }

      35% {
        filter:
          brightness(1.8)

          drop-shadow(
            0 0 18px
            rgba(255, 220, 130, 0.9)
          );
      }

      100% {
        filter:
          brightness(1);
      }
    }


    /* =========================
       ZARF AÇILMA ANİMASYONU
       ========================= */

    .envelope.open
    .envelope-flap {
      z-index: 1;

      transform:
        rotateX(180deg);

      transition:
        transform
        1.35s
        cubic-bezier(0.16, 1, 0.3, 1),

        z-index
        0s
        linear
        0.7s;
    }


    .envelope.open
    .letter {
      z-index: 7;

      width:
        min(73%, 390px);

      transform:
        translate(-50%, -52%);

      opacity: 1;

      transition:
        transform
        1.65s
        cubic-bezier(0.16, 1, 0.3, 1),

        width
        1.25s
        ease,

        opacity
        0.8s
        ease;

      transition-delay:
        0.55s;
    }


    .envelope.open
    .envelope-front::before {
      transform:
        translateX(-10px)
        translateY(6px)
        rotate(-3deg);

      filter:
        brightness(0.98);
    }


    .envelope.open
    .envelope-front::after {
      transform:
        translateX(10px)
        translateY(6px)
        rotate(3deg);

      filter:
        brightness(0.98);
    }


    .envelope.open
    .seal {
      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, -50%)
        scale(0.25)
        rotate(-20deg);
    }


    /* =========================
       DAVETİYE ALTIN IŞIĞI
       ========================= */

    .letter::after {
      content: "";

      position: absolute;

      top: -30%;

      left: -75%;

      width: 38%;

      height: 160%;

      background:
        linear-gradient(
          110deg,
          transparent 0%,
          rgba(255, 235, 175, 0.10) 30%,
          rgba(255, 244, 205, 0.80) 50%,
          rgba(255, 223, 140, 0.22) 70%,
          transparent 100%
        );

      transform:
        skewX(-18deg);

      opacity: 0;

      pointer-events: none;

      z-index: 10;
    }


    .envelope.open
    .letter::after {
      animation:
        invitationGoldSweep
        1.45s
        ease-in-out
        1.15s
        forwards;
    }


    @keyframes invitationGoldSweep {

      0% {
        left: -75%;

        opacity: 0;
      }

      20% {
        opacity: 0.9;
      }

      80% {
        opacity: 0.75;
      }

      100% {
        left: 140%;

        opacity: 0;
      }
    }


    /* =========================
       ZARF ARKASI IŞIK
       ========================= */

    .envelope::before {
      content: "";

      position: absolute;

      left: 50%;

      top: 45%;

      width: 135%;

      height: 145%;

      transform:
        translate(-50%, -50%)
        scale(0.75);

      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 239, 190, 0.55) 0%,
          rgba(231, 197, 112, 0.22) 36%,
          rgba(197, 155, 71, 0.08) 58%,
          transparent 75%
        );

      filter:
        blur(12px);

      opacity: 0;

      pointer-events: none;

      z-index: 0;

      transition:
        opacity
        1.2s
        ease,

        transform
        1.6s
        cubic-bezier(0.16, 1, 0.3, 1);
    }


    .envelope.open::before {
      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    /* =========================
       BUTON
       ========================= */

    .open-button {
      position: relative;

      z-index: 20;

      min-width: 210px;

      margin-top: 60px;

      padding:
        16px 34px;

      border: none;

      border-radius: 999px;

      background:
        linear-gradient(
          145deg,
          var(--green),
          var(--green-dark)
        );

      color: white;

      font-size:
        clamp(23px, 6vw, 30px);

      box-shadow:
        0 13px 28px
        rgba(69, 87, 59, 0.25);

      cursor: pointer;

      touch-action:
        manipulation;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform
        0.2s
        ease,

        box-shadow
        0.2s
        ease;
    }


    .open-button:active {
      transform:
        scale(0.97);
    }


    /* =========================
       DETAYLAR
       ========================= */

    .details {
      width:
        min(92%, 720px);

      margin:
        0 auto;

      padding:
        20px 0 80px;

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(34px);

      transition:
        opacity
        0.75s
        ease,

        transform
        0.75s
        ease,

        visibility
        0.75s;
    }


    .details.visible {
      opacity: 1;

      visibility: visible;

      transform:
        translateY(0);
    }


    .card {
      border:
        1px solid
        rgba(197, 155, 71, 0.25);

      border-radius: 24px;

      background:
        rgba(255, 253, 248, 0.93);

      box-shadow:
        0 18px 38px
        rgba(79, 63, 42, 0.12);
    }


    .countdown-card {
      padding:
        24px 14px;

      text-align: center;
    }


    .card-title {
      margin-bottom: 17px;

      color: var(--gold);

      font-size: 20px;

      font-weight: 600;

      letter-spacing: 0.07em;

      text-transform:
        uppercase;
    }


    .countdown {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 8px;
    }


    .time-box {
      padding:
        14px 4px;

      border-radius: 16px;

      background:
        #f5eddf;
    }


    .time-box strong {
      display: block;

      color:
        var(--green-dark);

      font-size:
        clamp(25px, 8vw, 42px);

      line-height: 1;
    }


    .time-box span {
      display: block;

      margin-top: 7px;

      font-size:
        clamp(12px, 3.6vw, 16px);
    }


    .information-card {
      margin-top: 20px;

      padding:
        8px 20px;
    }


    .information-item {
      min-height: 84px;

      display: flex;

      align-items: center;

      gap: 15px;

      border-bottom:
        1px solid
        rgba(197, 155, 71, 0.18);
    }


    .information-item:last-child {
      border-bottom: none;
    }


    .information-icon {
      width: 46px;

      height: 46px;

      display: grid;

      place-items: center;

      flex-shrink: 0;

      border-radius: 50%;

      background:
        #f3e7cf;

      font-size: 22px;
    }


    .information-item small {
      display: block;

      color:
        rgba(62, 55, 47, 0.62);

      font-size: 15px;
    }


    .information-item strong {
      display: block;

      font-size:
        clamp(19px, 5vw, 24px);
    }


    .action-buttons {
      margin-top: 22px;

      display: grid;

      gap: 12px;
    }


    .action-button {
      min-height: 60px;

      padding:
        13px 20px;

      display: flex;

      align-items: center;

      justify-content: center;

      border: none;

      border-radius: 999px;

      background:
        var(--green);

      color: white;

      text-decoration: none;

      font-size: 21px;

      box-shadow:
        0 10px 22px
        rgba(69, 87, 59, 0.18);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .action-button:active {
      transform:
        scale(0.98);
    }


    /* =========================
       ALT YAZI
       ========================= */

    .closing-text {
      margin-top: 44px;

      text-align: center;

      color:
        rgba(62, 55, 47, 0.68);

      font-size: 20px;

      letter-spacing:
        0.06em;
    }


    .signature {
      margin-top: 8px;

      text-align: center;

      color: var(--gold);

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(34px, 9vw, 48px);

      font-weight: 500;

      letter-spacing:
        0.02em;

      line-height: 1.1;
    }


    .signature .signature-initial {
      font-size: 1.28em;

      font-weight: 600;
    }


    .signature .signature-and {
      margin:
        0 8px;

      font-family:
        "Great Vibes",
        cursive;

      font-size:
        1.15em;

      font-weight: 400;
    }


    .signature-decoration {
      margin-top: 15px;

      text-align: center;

      color:
        rgba(197, 155, 71, 0.70);

      font-size: 17px;

      letter-spacing:
        8px;
    }


    /* =========================
       KONFETİ
       ========================= */

    .confetti-container {
      position: fixed;

      inset: 0;

      z-index: 50;

      overflow: hidden;

      pointer-events: none;
    }


    .confetti {
      position: absolute;

      top: -20px;

      width: 9px;

      height: 15px;

      border-radius: 2px;

      animation:
        confettiFall
        linear
        forwards;
    }


    @keyframes confettiFall {

      to {
        opacity: 0;

        transform:
          translateY(110vh)
          rotate(720deg);
      }
    }


    /* =========================
       TAM EKRAN DAVETİYE
       ========================= */

    .image-modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.92);
    }


    .image-modal.active {
      display: flex;
    }


    .image-modal img {
      max-width: 94vw;

      max-height: 90vh;

      object-fit: contain;

      border-radius: 12px;
    }


    .modal-close {
      position: absolute;

      top:
        max(
          18px,
          env(safe-area-inset-top)
        );

      right: 18px;

      width: 48px;

      height: 48px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.92);

      color: #222;

      font-size: 34px;

      line-height: 1;

      cursor: pointer;
    }


    #invitationImage {
      cursor: zoom-in;
    }


    /* =========================
       PARILTI
       ========================= */

    .sparkle-container {
      position: absolute;

      inset: -30px;

      z-index: 15;

      pointer-events: none;

      overflow: visible;
    }


    .sparkle {
      position: absolute;

      left: 50%;

      top: 50%;

      width: 4px;

      height: 4px;

      border-radius: 50%;

      background:
        #f4d77b;

      box-shadow:
        0 0 8px
        rgba(244, 215, 123, 0.95),

        0 0 16px
        rgba(197, 155, 71, 0.75);

      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(0);

      animation:
        sparkleBurst
        1.5s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }


    @keyframes sparkleBurst {

      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;

        transform:
          translate(
            calc(-50% + var(--sparkle-x)),
            calc(-50% + var(--sparkle-y))
          )
          scale(0.15);
      }
    }


    /* =========================
       YAPRAK EFEKTİ
       ========================= */

    .leaf {
      position: absolute;

      left: 50%;

      top: 50%;

      width: 26px;

      height: 13px;

      border-radius:
        100% 0 100% 0 /
        100% 0 100% 0;

      background:
        linear-gradient(
          135deg,
          #7f936f,
          #5d704f
        );

      opacity: 0;

      transform:
        translate(-50%, -50%)
        rotate(0deg)
        scale(0.4);

      animation:
        leafBurst
        1.9s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }


    .leaf::after {
      content: "";

      position: absolute;

      left: 3px;

      top: 50%;

      width: 20px;

      height: 1px;

      background:
        rgba(255, 255, 255, 0.55);

      transform:
        translateY(-50%)
        rotate(-5deg);

      border-radius:
        999px;
    }


    @keyframes leafBurst {

      0% {
        opacity: 0;

        transform:
          translate(-50%, -50%)
          rotate(0deg)
          scale(0.4);
      }

      20% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;

        transform:
          translate(
            calc(-50% + var(--leaf-x)),
            calc(-50% + var(--leaf-y))
          )
          rotate(var(--leaf-rotate))
          scale(1);
      }
    }


    /* =========================
       TABLET / PC
       ========================= */

    @media (min-width: 680px) {

      .action-buttons {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .action-button {
        font-size: 18px;
      }
    }


    /* =========================
       TELEFON
       ========================= */

    @media (max-width: 600px) {

      .hero {
        padding-top: 32px;
      }


      .envelope-stage {
        padding-top: 60px;
      }


      .envelope {
        width: 93vw;
      }


      .seal {
        width: 70px;

        height: 70px;

        font-size: 30px;
      }


      .envelope.open
      .letter {
        width:
          min(75%, 345px);

        transform:
          translate(-50%, -48%);

        transition-delay:
          0.55s;
      }


      .open-button {
        margin-top: 60px;
      }


      .d1 {
        left: 44px;
      }


      .d2 {
        right: 44px;
      }


      .d4 {
        left: 90px;
      }


      .d5 {
        right: 90px;
      }
    }


    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }


      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>
</head>


<body>

  <div class="background"></div>

  <div class="particles"></div>


  <main>


    <section class="hero">


      <p class="couple-title">

        <span class="initial">Z</span>eynep

        <span class="ampersand">&amp;</span>

        <span class="initial">A</span>hmet

      </p>


      <h1>

      <p class="intro">

        Bu özel günümüzde sizleri de aramızda görmekten mutluluk duyarız.

      </p>


      <div class="envelope-stage">

          <div class="envelope-decor">

            <span class="decor spark d3">

            <span class="decor spark d4">

            <span class="decor heart d5">

            <span class="decor spark d7">

            <span class="decor heart d8">

        <div class="information-item">

        <a

  <div

  <div
    class="image-modal"
    id="imageModal">


    <button
      type="button"
      class="modal-close"
      id="modalClose"
      aria-label="Görseli kapat">

      ×

    </button>

      src="davetiye.png.PNG"
      alt="Zeynep ve Ahmet nikah davetiyesi tam ekran">

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        const envelope =
          document.getElementById(
            "envelope"
          );


        const openButton =
          document.getElementById(
            "openButton"
          );


        const details =
          document.getElementById(
            "details"
          );


        const calendarButton =
          document.getElementById(
            "calendarButton"
          );


        const confettiContainer =
          document.getElementById(
            "confettiContainer"
          );


        const sparkleContainer =
          document.getElementById(
            "sparkleContainer"
          );


        const invitationImage =
          document.getElementById(
            "invitationImage"
          );


        const imageModal =
          document.getElementById(
            "imageModal"
          );


        const modalClose =
          document.getElementById(
            "modalClose"
          );


        let isOpen = false;

        let confettiPlayed = false;


        openButton.addEventListener(
          "click",
          function () {


            isOpen = !isOpen;


            envelope.classList.toggle(
              "open",
              isOpen
            );


            details.classList.toggle(
              "visible",
              isOpen
            );


            details.setAttribute(
              "aria-hidden",
              isOpen
                ? "false"
                : "true"
            );


            openButton.textContent =
              isOpen
                ? "Zarfı Kapat"
                : "Zarfı Aç";


            if (isOpen) {


              createSparkles();

              createLeaves();


              if (!confettiPlayed) {

                createConfetti();

                confettiPlayed = true;
              }


              setTimeout(
                function () {


                  details.scrollIntoView({

                    behavior:
                      "smooth",

                    block:
                      "start"

                  });


                },
                1900
              );

            }

          }
        );


        function updateCountdown() {


          const weddingDate =
            new Date(
              "2026-09-04T15:30:00+03:00"
            ).getTime();


          const difference =
            Math.max(
              0,
              weddingDate - Date.now()
            );


          const days =
            Math.floor(
              difference / 86400000
            );


          const hours =
            Math.floor(
              (difference / 3600000)
              % 24
            );


          const minutes =
            Math.floor(
              (difference / 60000)
              % 60
            );


          const seconds =
            Math.floor(
              (difference / 1000)
              % 60
            );


          document.getElementById(
            "days"
          ).textContent =
            String(days)
              .padStart(
                2,
                "0"
              );


          document.getElementById(
            "hours"
          ).textContent =
            String(hours)
              .padStart(
                2,
                "0"
              );


          document.getElementById(
            "minutes"
          ).textContent =
            String(minutes)
              .padStart(
                2,
                "0"
              );


          document.getElementById(
            "seconds"
          ).textContent =
            String(seconds)
              .padStart(
                2,
                "0"
              );

        }


        updateCountdown();


        setInterval(
          updateCountdown,
          1000
        );


        function createSparkles() {


          const sparkleCount =
            18;


          for (
            let i = 0;
            i < sparkleCount;
            i += 1
          ) {


            const sparkle =
              document.createElement(
                "span"
              );


            sparkle.className =
              "sparkle";


            const angle =
              Math.random()
              * Math.PI
              * 2;


            const distance =
              60
              + Math.random()
              * 110;


            const x =
              Math.cos(angle)
              * distance;


            const y =
              Math.sin(angle)
              * distance;


            sparkle.style.setProperty(
              "--sparkle-x",
              x + "px"
            );


            sparkle.style.setProperty(
              "--sparkle-y",
              y + "px"
            );


            sparkle.style.animationDelay =
              Math.random()
              * 0.25
              + "s";


            const size =
              4
              + Math.random()
              * 7;


            sparkle.style.width =
              size + "px";


            sparkle.style.height =
              size + "px";


            sparkleContainer
              .appendChild(
                sparkle
              );


            setTimeout(
              function () {

                sparkle.remove();

              },
              1900
            );

          }

        }


        function createLeaves() {


          const leafCount =
            8;


          for (
            let i = 0;
            i < leafCount;
            i += 1
          ) {


            const leaf =
              document.createElement(
                "span"
              );


            leaf.className =
              "leaf";


            const angle =
              Math.random()
              * Math.PI
              * 2;


            const distance =
              70
              + Math.random()
              * 100;


            const x =
              Math.cos(angle)
              * distance;


            const y =
              Math.sin(angle)
              * distance;


            const rotate =
              Math.floor(
                Math.random()
                * 360
              )
              + "deg";


            leaf.style.setProperty(
              "--leaf-x",
              x + "px"
            );


            leaf.style.setProperty(
              "--leaf-y",
              y + "px"
            );


            leaf.style.setProperty(
              "--leaf-rotate",
              rotate
            );


            leaf.style.animationDelay =
              Math.random()
              * 0.2
              + "s";


            sparkleContainer
              .appendChild(
                leaf
              );


            setTimeout(
              function () {

                leaf.remove();

              },
              2200
            );

          }

        }


        function createConfetti() {


          const colors = [

            "#c59b47",

            "#ead8ae",

            "#5d704f",

            "#ffffff",

            "#d8b86a"

          ];


          for (
            let i = 0;
            i < 22;
            i += 1
          ) {


            const piece =
              document.createElement(
                "span"
              );


            piece.className =
              "confetti";


            piece.style.left =
              Math.random()
              * 100
              + "%";


            piece.style.backgroundColor =
              colors[
                Math.floor(
                  Math.random()
                  * colors.length
                )
              ];


            piece.style.animationDelay =
              Math.random()
              * 1.2
              + "s";


            piece.style.animationDuration =
              2.8
              + Math.random()
              * 2
              + "s";


            confettiContainer
              .appendChild(
                piece
              );


            setTimeout(
              function () {

                piece.remove();

              },
              5500
            );

          }

        }


        calendarButton
          .addEventListener(
            "click",
            function () {


              const calendarData = [

                "BEGIN:VCALENDAR",

                "VERSION:2.0",

                "BEGIN:VEVENT",

                "SUMMARY:Zeynep ve Ahmet Nikah Töreni",

                "DTSTART:20260904T123000Z",

                "DTEND:20260904T143000Z",

                "LOCATION:Bornova Nikah Salonu",

                "DESCRIPTION:Zeynep ve Ahmet'in nikah töreni",

                "END:VEVENT",

                "END:VCALENDAR"

              ].join("\r\n");


              const calendarBlob =
                new Blob(
                  [calendarData],
                  {
                    type:
                      "text/calendar;charset=utf-8"
                  }
                );


              const calendarUrl =
                URL.createObjectURL(
                  calendarBlob
                );


              const downloadLink =
                document.createElement(
                  "a"
                );


              downloadLink.href =
                calendarUrl;


              downloadLink.download =
                "zeynep-ahmet-nikah.ics";


              document.body
                .appendChild(
                  downloadLink
                );


              downloadLink.click();


              downloadLink.remove();


              URL.revokeObjectURL(
                calendarUrl
              );

            }
          );


        invitationImage
          .addEventListener(
            "click",
            function () {


              imageModal
                .classList
                .add(
                  "active"
                );


              document.body
                .style
                .overflow =
                "hidden";

            }
          );


        function closeModal() {


          imageModal
            .classList
            .remove(
              "active"
            );


          document.body
            .style
            .overflow =
            "";

        }


        modalClose
          .addEventListener(
            "click",
            closeModal
          );


        imageModal
          .addEventListener(
            "click",
            function (event) {


              if (
                event.target
                === imageModal
              ) {

                closeModal();

              }

            }
          );


        document
          .addEventListener(
            "keydown",
            function (event) {


              if (
                event.key
                === "Escape"
                &&
                imageModal
                  .classList
                  .contains(
                    "active"
                  )
              ) {

                closeModal();

              }

            }
          );


      }
    );

  </script>


</body>
</html>
